<!--begin::Logo image-->
<a routerLink="/vnedu/so-dau-bai" class="d-flex align-items-center gap-3 text-decoration-none">
  <div class="d-flex align-items-center justify-content-center bg-primary text-white rounded-3 shadow-xs" style="width: 34px; height: 34px; flex-shrink: 0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      <path d="M12 6v6"></path>
      <path d="m9 9 3-3 3 3"></path>
    </svg>
  </div>
  <div class="d-flex flex-column app-sidebar-logo-default">
    <span class="text-white fw-bolder fs-6 ls-1 lh-1">vnEdu Sync</span>
    <span class="text-white-50 fs-8 mt-1">THCS An Lập</span>
    <span class="badge badge-light-primary fw-bolder fs-8 px-2.5 py-1 mt-1.5 align-self-start border border-primary border-opacity-25 shadow-xs">Phiên bản {{ appVersion }}</span>
  </div>
</a>
<!--end::Logo image-->

<ng-container *ngIf="toggleEnabled">
  <!--begin::Sidebar toggle-->
  <div id="kt_app_sidebar_toggle"
    class="app-sidebar-toggle btn btn-icon btn-shadow btn-sm btn-color-muted btn-active-color-primary body-bg h-30px w-30px position-absolute top-50 start-100 translate-middle rotate"
    [ngClass]="toggleButtonClass" data-kt-toggle="true" [attr.data-kt-toggle-state]="toggleState"
    data-kt-toggle-target="body" [attr.data-kt-toggle-name]="toggleAttr">
    <app-keenicon name="double-left" class="fs-2 rotate-180"></app-keenicon>
  </div>
  <!--end::Sidebar toggle-->
</ng-container>

<!-- Nút chuyển chế độ Sáng / Tối -->
<div class="app-navbar-item" [ngClass]="itemClass">
  <app-theme-mode-switcher [toggleBtnClass]="btnClass" toggleBtnClass="{`btn-active-light-primary btn-custom ${toolbarButtonHeightClass}`}"></app-theme-mode-switcher>
</div>

<!-- Cụm Avatar Cô Huyên & Menu Người Dùng -->
<div class="app-navbar-item" [ngClass]="itemClass">
  <div class="cursor-pointer d-flex align-items-center gap-2" data-kt-menu-trigger="{default: 'click'}" data-kt-menu-attach="parent" data-kt-menu-placement="bottom-end">
    <div class="d-none d-md-flex flex-column text-end me-1">
      <span class="text-gray-900 fw-bolder fs-7 lh-1">Cô Diệu Huyên</span>
      <span class="text-gray-500 fs-9 mt-1">THCS Phú Hòa</span>
    </div>
    <div class="symbol symbol-35px symbol-circle">
      <span class="symbol-label bg-primary text-white fw-bolder fs-6 shadow-xs">H</span>
    </div>
  </div>
  <app-user-inner data-kt-menu='true'></app-user-inner>
</div>

<!-- Nút Toggle Mobile Menu (Chỉ hiện trên mobile) -->
<ng-container *ngIf="appHeaderDefaulMenuDisplay">
  <div class="app-navbar-item d-lg-none ms-2 me-n3" title="Show header menu">
    <div class="btn btn-icon btn-active-color-primary w-35px h-35px" id="kt_app_header_menu_toggle">
      <app-keenicon name="element-4" class="fs-1" [ngClass]="btnIconClass"></app-keenicon>
    </div>
  </div>
</ng-container>

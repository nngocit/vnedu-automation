<ng-container *ngIf="user$ | async as _user">
  <!-- Header User Info -->
  <div class="menu-item px-3">
    <div class="menu-content d-flex align-items-center px-3 py-2">
      <!-- Avatar Cô Huyên -->
      <div class="symbol symbol-50px me-4">
        <div class="symbol-label bg-light-primary text-primary fw-bolder fs-3 rounded-circle border border-primary border-opacity-25" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
          H
        </div>
      </div>

      <div class="d-flex flex-column">
        <div class="fw-bolder d-flex align-items-center fs-6 text-gray-900">
          Cô Lê Thị Diệu Huyên
        </div>
        <span class="badge badge-light-primary fw-bold fs-9 mt-1 align-self-start">
          THCS An Lập • Giáo viên
        </span>
        <div class="text-gray-500 fs-8 mt-1">
          vnEdu: <strong>051197003685</strong>
        </div>
      </div>
    </div>
  </div>

  <div class="separator my-2"></div>

  <!-- Menu 1: Sổ Đầu Bài -->
  <div class="menu-item px-4">
    <a routerLink="/vnedu/so-dau-bai" class="menu-link px-4 py-3 text-gray-800 text-hover-primary">
      <span class="menu-icon me-3">
        <app-keenicon name="book-open" class="fs-3 text-primary"></app-keenicon>
      </span>
      <span class="menu-title fw-bold fs-7">Sổ Đầu Bài & Lịch Dạy</span>
    </a>
  </div>

  <!-- Menu 2: Cấu hình PPCT -->
  <div class="menu-item px-4">
    <a routerLink="/vnedu/ppct" class="menu-link px-4 py-3 text-gray-800 text-hover-primary">
      <span class="menu-icon me-3">
        <app-keenicon name="setting-2" class="fs-3 text-primary"></app-keenicon>
      </span>
      <span class="menu-title fw-bold fs-7">Cấu Hình PPCT Môn Học</span>
    </a>
  </div>

  <!-- Menu 3: Cổng vnEdu trực tuyến -->
  <div class="menu-item px-4">
    <a href="https://uaevcmanmsgdbinhduong.vnedu.vn" target="_blank" class="menu-link px-4 py-3 text-gray-800 text-hover-primary">
      <span class="menu-icon me-3">
        <app-keenicon name="external-drive" class="fs-3 text-success"></app-keenicon>
      </span>
      <span class="menu-title fw-bold fs-7">Cổng vnEdu Sở GD&ĐT</span>
      <span class="badge badge-light-success fs-9 ms-auto">Mở web</span>
    </a>
  </div>

  <div class="separator my-2"></div>

  <!-- Nút Đăng Xuất (Sign Out) -->
  <div class="menu-item px-4 my-1">
    <a (click)="logout()" class="menu-link px-4 py-3 text-danger text-hover-danger bg-hover-light-danger rounded-2 cursor-pointer">
      <span class="menu-icon me-3">
        <app-keenicon name="exit-right" class="fs-3 text-danger"></app-keenicon>
      </span>
      <span class="menu-title fw-bolder fs-7">Đăng Xuất Tài Khoản</span>
    </a>
  </div>
</ng-container>
